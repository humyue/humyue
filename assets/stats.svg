      .t, .val, .strong { fill: #E7E5E4; }
      .val.hero { fill: #FEF3C7; }
      .lab, .tm { fill: #A8A29E; }
      .bt { fill: #FEF3C7; }
      .chip { fill: #78350F; stroke: #B45309; }
      .s1 { fill: #F59E0B; }
      .s2 { fill: #92400E; }
      .s3 { fill: #D97706; }
      .s4 { fill: #FB923C; }
      .so { fill: #57534E; }
      .accent { fill: #F59E0B; }
    }
